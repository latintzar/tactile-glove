<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2700" viewBox="0 0 1400 2700"><style>text{font-family:monospace;font-size:15px}.title{font-size:26px;font-weight:bold}.box{fill:#f7f4eb;stroke:#263943;stroke-width:2}.wire{stroke:#8a3b12;stroke-width:2;fill:none}.net{fill:#5a2c82;font-size:13px}</style><rect x="20" y="20" width="1360" height="820" fill="#fff" stroke="#aaa"/><text class="title" x="45" y="60">SHEET 1 — XIAO / POWER / CONTROLLER / DISPLAY / IMU</text><rect class="box" x="70" y="120" width="260" height="150" rx="8"/><text x="82" y="148">J_XIAO XIAO nRF52840 Sense</text><text x="82" y="172">USB-C + BLE + 3V3 + BQ25101 charger</text><rect class="box" x="430" y="100" width="250" height="110" rx="8"/><text x="442" y="128">U_LDO TLV75518</text><text x="442" y="152">3V3 → 1V8 ADC AVDD</text><rect class="box" x="430" y="250" width="250" height="110" rx="8"/><text x="442" y="278">U_REF MCP1501T-25E/SN</text><text x="442" y="302">3V3 → VREF2V5</text><rect class="box" x="430" y="400" width="250" height="110" rx="8"/><text x="442" y="428">U_VMID MCP6002</text><text x="442" y="452">VREF2V5 → VEXC2V5; VMID1V25</text><rect class="box" x="820" y="100" width="260" height="110" rx="8"/><text x="832" y="128">J_IMU Adafruit 4502</text><text x="832" y="152">I2C; INT1 → IOX.P0</text><rect class="box" x="820" y="250" width="260" height="110" rx="8"/><text x="832" y="278">J_OLED Adafruit 4440</text><text x="832" y="302">I2C status display</text><rect class="box" x="820" y="400" width="260" height="110" rx="8"/><text x="832" y="428">U_IOX PCF8574T</text><text x="832" y="452">slow buttons + IMU_INT1</text><path class="wire" d="M330 165 H460"/><text class="net" x="340" y="160">3V3</text><path class="wire" d="M330 190 H460"/><text class="net" x="340" y="185">I2C_SDA/SCL</text><path class="wire" d="M680 155 H810"/><text class="net" x="690" y="150">1V8</text><path class="wire" d="M680 305 H810"/><text class="net" x="690" y="300">VREF2V5</text><path class="wire" d="M680 455 H810"/><text class="net" x="690" y="450">VEXC2V5 / VMID1V25</text><path class="wire" d="M680 155 H810"/><text class="net" x="690" y="150">1V8</text><text x="70" y="690">Pin budget: D0-D3 shared mux address; D6-D7 final bank select; D8 SCK; D9 MISO; D10 CNV; D4/D5 I2C.</text><text x="70" y="720">Battery connects only to XIAO BAT+/BAT−; USB-C charging remains XIAO onboard path. No external charger path is assumed.</text><rect x="20" y="920" width="1360" height="820" fill="#fff" stroke="#aaa"/><text class="title" x="45" y="960">SHEET 2 — 20 PVDF CELLS / FILTERS / MUX / ADC</text><rect class="box" x="60" y="1010" width="260" height="120" rx="8"/><text x="72" y="1038">PVDF_T1..H2 ×20</text><text x="72" y="1062">independent electrodes</text><rect class="box" x="400" y="980" width="300" height="170" rx="8"/><text x="412" y="1008">U_CHG1..5 MCP6004</text><text x="412" y="1032">20 charge amps; Rf 100M || Cf 100pF; Vmid1V25</text><rect class="box" x="780" y="980" width="300" height="170" rx="8"/><text x="792" y="1008">U_FILT1..10 MCP6004</text><text x="792" y="1032">40 filter channels; two unity Sallen-Key stages/cell</text><rect class="box" x="1140" y="980" width="200" height="170" rx="8"/><text x="1152" y="1008">U_MUX1..4</text><text x="1152" y="1032">2×16:1 dynamic + 2×16:1 pressure</text><rect class="box" x="400" y="1270" width="300" height="120" rx="8"/><text x="412" y="1298">U_BANK1..2</text><text x="412" y="1322">buffer mux outputs</text><rect class="box" x="780" y="1270" width="300" height="120" rx="8"/><text x="792" y="1298">U_MUX_FINAL</text><text x="792" y="1322">CD74HC4052M 4:1</text><rect class="box" x="1140" y="1270" width="200" height="120" rx="8"/><text x="1152" y="1298">U_ADC_DRV</text><text x="1152" y="1322">OPA320AIDBVR pending settle</text><rect class="box" x="1140" y="1460" width="200" height="120" rx="8"/><text x="1152" y="1488">U_ADC</text><text x="1152" y="1512">MCP33131D-10-I/MS; AVDD1V8; VREF2V5</text><path class="wire" d="M320 1080 H380"/><text class="net" x="330" y="1075">PVDF_i</text><path class="wire" d="M320 1060 H380"/><text class="net" x="330" y="1055">CHG_i</text><path class="wire" d="M320 1060 H380"/><text class="net" x="330" y="1055">FILT_i</text><path class="wire" d="M320 1060 H380"/><text class="net" x="330" y="1055">DYN/PRESS bank</text><path class="wire" d="M700 1330 H760"/><text class="net" x="710" y="1325">buffered bank</text><path class="wire" d="M700 1330 H760"/><text class="net" x="710" y="1325">ADC_MUX_OUT</text><path class="wire" d="M700 1520 H760"/><text class="net" x="710" y="1515">ADC_AINP vs VMID1V25</text><text x="70" y="1680">Raw budget: 20×8kS/s dynamic = 160kS/s; 20×100S/s pressure = 2kS/s; fixed 1Msps SAR, dummy conversions after mux changes.</text><text x="70" y="1710">Digital low-pass + decimation to 4kS/s is required and not implemented in this electrical package.</text><rect x="20" y="1820" width="1360" height="820" fill="#fff" stroke="#aaa"/><text class="title" x="45" y="1860">SHEET 3 — SIX GH SENSOR BRANCHES / 20 SENSOR IDs</text><rect class="box" x="70" y="1900" width="360" height="150" rx="8"/><text x="82" y="1928">J_THUMB</text><text x="82" y="1952">6-pin JST GH branch</text><text x="82" y="1980">IDs: T1, T2</text><text x="82" y="2008">PVDF_i + PRESS_i + VEXC2V5 + GND</text><rect class="box" x="500" y="1900" width="360" height="150" rx="8"/><text x="512" y="1928">J_INDEX</text><text x="512" y="1952">8-pin JST GH branch</text><text x="512" y="1980">IDs: I1, I2, I3</text><text x="512" y="2008">PVDF_i + PRESS_i + VEXC2V5 + GND</text><rect class="box" x="930" y="1900" width="360" height="150" rx="8"/><text x="942" y="1928">J_MIDDLE</text><text x="942" y="1952">8-pin JST GH branch</text><text x="942" y="1980">IDs: M1, M2, M3</text><text x="942" y="2008">PVDF_i + PRESS_i + VEXC2V5 + GND</text><rect class="box" x="70" y="2120" width="360" height="150" rx="8"/><text x="82" y="2148">J_RING</text><text x="82" y="2172">8-pin JST GH branch</text><text x="82" y="2200">IDs: R1, R2, R3</text><text x="82" y="2228">PVDF_i + PRESS_i + VEXC2V5 + GND</text><rect class="box" x="500" y="2120" width="360" height="150" rx="8"/><text x="512" y="2148">J_LITTLE</text><text x="512" y="2172">8-pin JST GH branch</text><text x="512" y="2200">IDs: L1, L2, L3</text><text x="512" y="2228">PVDF_i + PRESS_i + VEXC2V5 + GND</text><rect class="box" x="930" y="2120" width="360" height="150" rx="8"/><text x="942" y="2148">J_PALM_HEEL</text><text x="942" y="2172">14-pin JST GH branch</text><text x="942" y="2200">IDs: P1, P2, P3, P4, H1, H2</text><text x="942" y="2228">PVDF_i + PRESS_i + VEXC2V5 + GND</text><text x="70" y="2390">IDs: T1,T2; I1–I3; M1–M3; R1–R3; L1–L3; P1–P4; H1–H2. Pressure is independent per sensor.</text><text x="70" y="2420">Carrier target: 70×46 mm, four-layer spatial plan. Routed CAD, exact module CAD fit, intrinsic SNR and filter/ADC settling remain open.</text><text x="70" y="2470">ALL INPUT LABELS (PVDF / PRESS):</text><text x="70" y="2500">J_THUMB: PVDF_T1 / PRESS_T1  PVDF_T2 / PRESS_T2</text><text x="70" y="2528">J_INDEX: PVDF_I1 / PRESS_I1  PVDF_I2 / PRESS_I2  PVDF_I3 / PRESS_I3</text><text x="70" y="2556">J_MIDDLE: PVDF_M1 / PRESS_M1  PVDF_M2 / PRESS_M2  PVDF_M3 / PRESS_M3</text><text x="70" y="2584">J_RING: PVDF_R1 / PRESS_R1  PVDF_R2 / PRESS_R2  PVDF_R3 / PRESS_R3</text><text x="70" y="2612">J_LITTLE: PVDF_L1 / PRESS_L1  PVDF_L2 / PRESS_L2  PVDF_L3 / PRESS_L3</text><text x="70" y="2640">J_PALM_HEEL: PVDF_P1 / PRESS_P1  PVDF_P2 / PRESS_P2  PVDF_P3 / PRESS_P3  PVDF_P4 / PRESS_P4  PVDF_H1 / PRESS_H1  PVDF_H2 / PRESS_H2</text></svg>