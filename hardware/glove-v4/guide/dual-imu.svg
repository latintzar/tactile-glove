<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">Two motion sensors on the right glove</title><desc id="desc">Back of right hand. A 16 millimetre tile sits over the third metacarpal and connects to the cuff through a 100 millimetre keyed four-wire cable. The cuff has its own soldered IMU and camera. Both sensors share power and communications.</desc><rect width="960" height="820" rx="20" fill="#f3f3ea"/>
