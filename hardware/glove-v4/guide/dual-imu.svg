<g font-family="system-ui,sans-serif" fill="#243f32"><text x="607" y="223" font-size="21" font-weight="650">2 · Hand sensor</text><text x="607" y="249" font-size="15">16 × 16 mm board in a soft pocket</text><text x="607" y="295" font-size="15">Over the third metacarpal.</text><text x="607" y="318" font-size="15">Arrow points to the middle finger.</text><text x="607" y="341" font-size="15">Connector faces the wrist.</text>
<text x="607" y="377" font-size="21" font-weight="650">One keyed cable</text><text x="607" y="402" font-size="15">100 mm · cuff J15 → hand J1</text><text x="607" y="448" font-size="15">Keep a shallow S loop over the wrist.</text><text x="607" y="471" font-size="15">Secure the jacket behind each plug.</text><text x="607" y="502" font-size="14">1 GND · 2 power · 3 SDA · 4 SCL</text>
<text x="607" y="546" font-size="21" font-weight="650">1 · Cuff sensor</text><text x="607" y="571" font-size="15">Soldered onto the main board</text><text x="607" y="620" font-size="15">Measures cuff and camera motion.</text><text x="607" y="643" font-size="15">The hand tile measures motion</text><text x="607" y="666" font-size="15">across the wrist joint.</text>
<text x="44" y="787" font-size="13" fill="#607367">Both: ISM330DHCX · shared cuff battery/radio · placement diagram; use supplied CAD for dimensions.</text><text x="44" y="808" font-size="13" fill="#607367">Relative orientation requires calibration and sensor fusion. Absolute position requires external tracking updates.</text></g></svg>
