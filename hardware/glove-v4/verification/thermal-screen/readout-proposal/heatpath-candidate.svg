<text x="555" y="550" font-size="17">Battery and wrist isolation</text><text x="555" y="576" font-size="13">Bridge stays abovePCB; no conductive link to cells or floor.</text><text x="555" y="598" font-size="13">Existing pack/PCB air separation and1.7mm bottom foam remain.</text><text x="35" y="645" font-size="14">Thermal target: measured MCU-shield→insert≤5K/W; this is a local path, not a whole-case isothermal assumption.</text><text x="35" y="668" font-size="14">Candidate mass: ~26.5g Al before holes; removed PA12~8g; net addition~18.5g plus gasket/pad/fasteners.</text><text x="35" y="696" font-size="13">Review gates: gasketed roof capture, pad pressure/height, contact resistance, EMC, exposed-metal touch limit and full workload fixture test.</text>
