name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/check_package.py
      - run: python tools/tactile_v4/run_native.py --output /tmp/tactile-v4-native
      - run: python -m pytest tools/tactile_v4/test_protocol.py tools/tactile_v4/test_piezo_e2e.py tests/test_local_server.py tests/test_inventory_refresh.py -q
      - run: python firmware/tactile_v4/camera_override/tests/test_cam_take.py
      - run: node --experimental-default-type=module tools/tactile_v4/test_web_wire.mjs
